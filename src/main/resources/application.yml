sspring:
  datasource:
    url: jdbc:postgresql://localhost:5432/springlab
    username: springlab
    password: springlab
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration