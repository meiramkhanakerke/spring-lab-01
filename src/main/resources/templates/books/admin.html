<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Administration</title>
</head>
<body>
<div style="margin-bottom: 12px; padding: 8px; border-bottom: 1px solid #ccc;">
    Logged in as: <strong sec:authentication="name">anonymous</strong>
    (<span sec:authentication="principal.authorities">[ROLE_ADMIN]</span>) |
    <a th:href="@{/books}">Back to Books</a>
    <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
        <button type="submit">Log out</button>
    </form>
</div>

<h1>Users Management</h1>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Enabled</th>
        <th>Roles</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.username}">user</td>
        <td th:text="${u.enabled}">true</td>
        <td th:text="${u.roles}">[USER]</td>
    </tr>
    </tbody>
</table>

<!-- Вариант 6: inline-скрипт блокируется заголовком Content-Security-Policy -->
<script>
    console.log("Inline script test");
</script>
</body>
</html>
