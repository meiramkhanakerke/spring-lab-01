<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{book.new}">New book</title>
</head>
<body>

<div>
    <a th:href="@{/books/new(lang='en')}">EN</a> |
    <a th:href="@{/books/new(lang='ru')}">RU</a>
</div>

<h1 th:text="#{book.new}">New book</h1>

<form th:action="@{/books}" th:object="${form}" method="post">
    <div>
        <label for="title" th:text="#{book.title}">Title</label>:
        <input type="text" id="title" th:field="*{title}" />
        <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red"></span>
    </div>
    <br/>
    <div>
        <label for="author" th:text="#{book.author}">Author</label>:
        <input type="text" id="author" th:field="*{author}" />
        <span th:if="${#fields.hasErrors('author')}" th:errors="*{author}" style="color:red"></span>
    </div>
    <br/>
    <div>
        <label for="year" th:text="#{book.year}">Year</label>:
        <input type="number" id="year" th:field="*{year}" />
        <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" style="color:red"></span>
    </div>
    <br/>
    <div>
        <label for="genre" th:text="#{book.genre}">Genre</label>:
        <select id="genre" th:field="*{genre}">
            <option value="">--</option>
            <option th:each="g : ${genres}" th:value="${g}" th:text="${g}"></option>
        </select>
        <span th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}" style="color:red"></span>
    </div>
    <br/>
    <div>
        <input type="checkbox" id="available" th:field="*{available}" />
        <label for="available" th:text="#{book.available}">Available</label>
    </div>
    <br/>
    <button type="submit" th:text="#{form.submit}">Save</button>
</form>

</body>
</html>
