<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 - Book Not Found</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f8f9fa; }
        .card { background: white; padding: 30px; border-radius: 8px; border-left: 6px solid #dc3545; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; }
        h1 { color: #dc3545; margin-top: 0; }
        p { font-size: 16px; color: #333; }
        a { display: inline-block; margin-top: 15px; color: #0d6efd; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>404 - Book Not Found</h1>
    <p th:text="${message}">Book was not found in the catalog.</p>
    <a href="/books/new">← Back to Form</a>
</div>

</body>
</html>
